# Production Configuration
server.port=8081
server.servlet.context-path=/

# Logging
logging.level.com.gov.docregistry=INFO
logging.level.org.hyperledger.fabric=WARN
logging.level.io.grpc=WARN
logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# IPFS Configuration
ipfs.apiBase=http://ipfs:5001

# Security
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Application Info
info.app.name=Government Document Registry
info.app.description=Blockchain-based document verification system
info.app.version=1.0.0
