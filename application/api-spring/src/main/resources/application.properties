server.port=8081
server.address=${REGISTRY_BIND_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.datasource.url=${REGISTRY_DATABASE_URL:jdbc:h2:file:./data/registry;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${REGISTRY_DATABASE_PASSWORD:}
spring.h2.console.enabled=false
ipfs.apiBase=${IPFS_API_BASE:http://127.0.0.1:5001}
registry.issuer=${REGISTRY_ISSUER:Org1}
registry.fabric.peer=${FABRIC_PEER:localhost:17051}
registry.fabric.authority=${FABRIC_AUTHORITY:peer0.org1.example.com}
registry.fabric.msp=${FABRIC_MSP:Org1MSP}
registry.fabric.channel=${FABRIC_CHANNEL:govchannel}
registry.fabric.chaincode=${FABRIC_CHAINCODE:docregistry}
registry.fabric.certificate=${FABRIC_CERT:.runtime/identity/signcerts/cert.pem}
registry.fabric.private-key=${FABRIC_KEY:.runtime/identity/keystore/key.pem}
registry.fabric.tls-certificate=${FABRIC_TLS_CERT:.runtime/identity/tls-ca.pem}
registry.auth.mode=${REGISTRY_AUTH_MODE:basic}
registry.auth.users-file=${REGISTRY_USERS_FILE:.runtime/secrets/users.json}
registry.auth.issuer-uri=${REGISTRY_JWT_ISSUER:}
registry.auth.audience=${REGISTRY_JWT_AUDIENCE:govdoc-api}
registry.auth.require-https=${REGISTRY_REQUIRE_HTTPS:false}
registry.auth.cors-origins=${REGISTRY_CORS_ORIGINS:}
registry.encryption.keys-file=${REGISTRY_KEYS_FILE:.runtime/secrets/encryption.json}
registry.upload.max-bytes=10485760
registry.rate-limit.per-minute=${REGISTRY_RATE_LIMIT:120}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,registryDependencies,db
management.endpoint.health.group.liveness.include=livenessState

registry.rate-limit.per-ip-minute=${REGISTRY_IP_RATE_LIMIT:600}
