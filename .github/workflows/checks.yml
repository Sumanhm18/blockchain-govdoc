name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chaincode/docregistry/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python3 scripts/check-secrets.py
      - run: npm ci --prefix chaincode/docregistry
      - run: npm test --prefix chaincode/docregistry
      - run: npm audit --prefix chaincode/docregistry --audit-level=high
      - run: mvn -B -f application/api-spring/pom.xml verify
