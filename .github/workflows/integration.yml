name: Development integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and provision isolated development stack
        run: ./deploy.sh
      - name: Synthetic API, Fabric and IPFS scenario
        run: ./test_demo.sh
      - name: Durable recovery across IPFS outage and API restart
        run: python3 scripts/test-recovery.py
      - name: Stop only this project's services
        if: always()
        run: ./scripts/stop-dev.sh
      # Do not upload runtime logs: CA/bootstrap logs can contain generated secrets.
