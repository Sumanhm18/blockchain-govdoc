name: Development integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: Development integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and provision isolated development stack
        run: ./deploy.sh
      - name: Synthetic API, Fabric and IPFS scenario
        run: ./test_demo.sh
      - name: Submission presentation walkthrough
        run: ./demo.sh
      - name: Durable recovery across IPFS outage and API restart
        run: python3 scripts/test-recovery.py
      - name: Quorum and certificate revocation recovery
        run: |
          python3 scripts/test-quorum-recovery.py
          python3 scripts/test-revocation.py
      - name: HTTPS and real identity-provider checks
        run: |
          ./scripts/staging.sh up
          python3 scripts/wait-staging.py
          python3 scripts/test-oidc.py
          python3 scripts/verify-identity-images.py
      - name: Encrypted backup restore drill
        run: |
          python3 -m venv .runtime/ops-tools
          .runtime/ops-tools/bin/pip install -r config/operations-tools-requirements.txt
          .runtime/ops-tools/bin/python scripts/test-backup-restore.py
      - name: Stop staging
        if: always()
        run: ./scripts/staging.sh stop
      - name: Stop only this project's services
        if: always()
        run: ./scripts/stop-dev.sh
      # Do not upload runtime logs: CA/bootstrap logs can contain generated secrets.
