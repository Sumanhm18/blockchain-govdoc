name: govdoc-dev-app
services:
  ipfs:
    image: govdoc-ipfs:local
    build:
      context: ./deploy
      dockerfile: ipfs.Dockerfile
      args:
        IPFS_IMAGE: ipfs/kubo:v0.43.1@sha256:b293923d66e490e70ced64df42ea7a6cf7eac2740e3fb29101df18070fa7be48
    ports:
      - "127.0.0.1:15001:5001"
    environment:
      IPFS_PROFILE: server
    volumes:
      - ipfs-data:/data/ipfs
    networks: [storage]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: ./application/api-spring
    user: "${REGISTRY_UID:-10001}:${REGISTRY_GID:-10001}"
    ports:
      - "127.0.0.1:18081:8081"
    environment:
      REGISTRY_BIND_ADDRESS: 0.0.0.0
      REGISTRY_AUTH_MODE: basic
      REGISTRY_REQUIRE_HTTPS: "false"
      IPFS_API_BASE: http://ipfs:5001
      FABRIC_PEER: peer0.org1.example.com:7051
      FABRIC_AUTHORITY: peer0.org1.example.com
      FABRIC_CERT: /run/identity/signcerts/cert.pem
      FABRIC_KEY: /run/identity/keystore/key.pem
      FABRIC_TLS_CERT: /run/identity/tls-ca.pem
      REGISTRY_USERS_FILE: /run/secrets/users.json
      REGISTRY_KEYS_FILE: /run/secrets/encryption.json
      REGISTRY_DATABASE_URL: jdbc:h2:file:/app/data/registry;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - ./.runtime/identity:/run/identity:ro
      - ./.runtime/secrets/users.json:/run/secrets/users.json:ro
      - ./.runtime/secrets/encryption.json:/run/secrets/encryption.json:ro
      - ./.runtime/data:/app/data
      - ./.runtime/logs/api:/app/logs
    networks: [fabric, storage]
    depends_on:
      ipfs:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
networks:
  fabric:
    external: true
    name: govdoc_dev
  storage:
volumes:
  ipfs-data:
